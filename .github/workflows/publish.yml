# Build, test on all platforms, and publish to private PyPI on version tag pushes
# Publishes to https://pypi.component-ai.dk/

name: Build and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      FUTHARK_VERSION: "0.26.1"
    strategy:
      fail-fast: false
      matrix:
        # Note: Windows is excluded because Futhark's C backend generates GCC-specific code
        # (__attribute__, __uint128_t, __builtin_clz, VLAs) that's incompatible with MSVC.
        # Windows users need MinGW or WSL to compile Futhark code.
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Linux: Install Futhark from GitHub releases
      - name: Install Futhark (Linux)
        if: runner.os == 'Linux'
        run: |
          FUTHARK_TARBALL="futhark-${FUTHARK_VERSION}-linux-x86_64.tar.xz"
          curl -L "https://github.com/diku-dk/futhark/releases/download/v${FUTHARK_VERSION}/${FUTHARK_TARBALL}" -o futhark.tar.xz
          tar -xJf futhark.tar.xz
          sudo cp "futhark-${FUTHARK_VERSION}-linux-x86_64/bin/"* /usr/local/bin/
          futhark --version | grep -q "Futhark ${FUTHARK_VERSION}."

      # macOS: Install Futhark from GitHub releases (supports both x86_64 and arm64)
      - name: Install Futhark (macOS)
        if: runner.os == 'macOS'
        run: |
          ARCH=$(uname -m)
          FUTHARK_TARBALL="futhark-${FUTHARK_VERSION}-macos-${ARCH}.tar.xz"
          curl -L "https://github.com/diku-dk/futhark/releases/download/v${FUTHARK_VERSION}/${FUTHARK_TARBALL}" -o futhark.tar.xz
          tar -xJf futhark.tar.xz
          sudo cp "futhark-${FUTHARK_VERSION}-macos-${ARCH}/bin/"* /usr/local/bin/
          futhark --version | grep -q "Futhark ${FUTHARK_VERSION}."

      - name: Install package
        run: |
          uv pip install --system setuptools  # Required by cffi on Python 3.12+
          uv pip install --system -e .

      - name: Compile Futhark test files
        run: |
          futhark c --library test.fut
          futhark c --library test_badconsts.fut
          build_futhark_ffi test
          build_futhark_ffi test_badconsts

      - name: Run tests
        run: |
          python test.py

  publish:
    name: Publish to Private PyPI
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for setuptools-scm if used

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build package
        run: uv build

      - name: Publish to private PyPI
        # The private PyPI at pypi.component-ai.dk authenticates using GitHub PATs
        # from the componentai org.
        env:
          UV_PUBLISH_USERNAME: __token__
          UV_PUBLISH_PASSWORD: ${{ secrets.ORG_READ_ACCESS_TOKEN }}
        run: |
          uv publish \
            --publish-url https://pypi.component-ai.dk/upload/ \
            dist/*.whl
